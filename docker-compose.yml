name: callshift-hr

services:
  # ============================================================================
  # DATABASE: PostgreSQL 16
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: callshift-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-callshift_hr}
      POSTGRES_USER: ${DB_USERNAME:-callshift_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-callshift_secret_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    networks:
      - callshift-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-callshift_user} -d ${DB_DATABASE:-callshift_hr}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # CACHE & QUEUES: Redis 7
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: callshift-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-redis_secret_2026}"
    volumes:
      - redis_data:/data
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    networks:
      - callshift-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret_2026}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ============================================================================
  # BACKEND API: Laravel 11 (PHP 8.3 + FPM + Nginx)
  # ============================================================================
  api:
    build:
      context: ./callshift-api
      dockerfile: Dockerfile
      target: production
    container_name: callshift-api
    restart: unless-stopped
    environment:
      APP_NAME: "CallShift HR"
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-base64:q6s1A3oGZt4j8fX9bV2k5L7m8N0p1Q2r3S4t5U6v7W8=}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8000}
      APP_TIMEZONE: "America/Lima"
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-callshift_hr}
      DB_USERNAME: ${DB_USERNAME:-callshift_user}
      DB_PASSWORD: ${DB_PASSWORD:-callshift_secret_2026}

      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis

      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret_2026}
      REDIS_PORT: 6379

      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_ENCRYPTION: null
      MAIL_FROM_ADDRESS: "no-reply@callshift.com"
      MAIL_FROM_NAME: "CallShift HR"
    volumes:
      - api_storage:/var/www/html/storage
    ports:
      - "${FORWARD_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - callshift-network

  # ============================================================================
  # FRONTEND CLIENT: React + Vite (Nginx Alpine)
  # ============================================================================
  client:
    build:
      context: ./callshift-client
      dockerfile: Dockerfile
      target: production
    container_name: callshift-client
    restart: unless-stopped
    ports:
      - "${FORWARD_CLIENT_PORT:-3000}:80"
    depends_on:
      - api
    networks:
      - callshift-network

  # ============================================================================
  # LOCAL MAIL TESTING: Mailpit
  # ============================================================================
  mailpit:
    image: axllent/mailpit:latest
    container_name: callshift-mailpit
    restart: unless-stopped
    ports:
      - "${FORWARD_MAILPIT_SMTP_PORT:-1025}:1025"
      - "${FORWARD_MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - callshift-network

# ==============================================================================
# VOLUMES & NETWORKS
# ==============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  api_storage:
    driver: local

networks:
  callshift-network:
    driver: bridge
